name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Lua ${{ matrix.lua-version }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.4", "5.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v10
        with:
          lua-version: ${{ matrix.lua-version }}

      - name: Run test suite
        working-directory: qb-emsjob
        run: lua tests/run_tests.lua
